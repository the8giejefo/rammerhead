<style>
  :root {
    --bg: #020817;
    --ink: #e8f0ff;
    --muted: #8fa6d6;
    --glass: rgba(10, 24, 64, 0.55);
    --line: rgba(120, 170, 255, 0.22);
    --accent: #2f7bff;
    --accent-2: #5cc8ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  /* ---------- Aurora ---------- */
  .aurora {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background:
      radial-gradient(120% 90% at 50% 120%, #06174a 0%, transparent 60%),
      linear-gradient(180deg, #01040f 0%, #031033 55%, #020817 100%);
  }
  .blob {
    position: absolute; border-radius: 50%;
    filter: blur(90px); opacity: .75; mix-blend-mode: screen;
    will-change: transform;
  }
  .b1 { width: 62vmax; height: 62vmax; left: -15vmax; top: -20vmax;
        background: radial-gradient(circle at 35% 35%, #1b49d8, #0a1f78 60%, transparent 72%);
        animation: drift1 26s ease-in-out infinite alternate; }
  .b2 { width: 55vmax; height: 55vmax; right: -18vmax; top: 8vmax;
        background: radial-gradient(circle at 50% 50%, #1f6bff, #0b2a9a 55%, transparent 70%);
        animation: drift2 32s ease-in-out infinite alternate; }
  .b3 { width: 48vmax; height: 48vmax; left: 10vmax; bottom: -22vmax;
        background: radial-gradient(circle at 50% 50%, #0e3fb8, #071a5c 60%, transparent 72%);
        animation: drift3 30s ease-in-out infinite alternate; }
  .b4 { width: 34vmax; height: 34vmax; left: 38vmax; top: 18vmax;
        background: radial-gradient(circle at 50% 50%, #2aa6ff88, #1456d655 55%, transparent 72%);
        animation: drift4 22s ease-in-out infinite alternate; opacity: .55; }
  .b5 { width: 28vmax; height: 28vmax; right: 8vmax; bottom: -10vmax;
        background: radial-gradient(circle at 50% 50%, #17c3d855, #0a3a8f44 55%, transparent 72%);
        animation: drift2 28s ease-in-out infinite alternate-reverse; opacity: .5; }
  @keyframes drift1 { to { transform: translate(18vmax, 14vmax) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-16vmax, 10vmax) scale(.9); } }
  @keyframes drift3 { to { transform: translate(14vmax, -12vmax) scale(1.2); } }
  @keyframes drift4 { to { transform: translate(-10vmax, -8vmax) scale(1.3); } }

  /* ribbon of aurora light */
  .ribbon {
    position: absolute; left: -20%; right: -20%; top: 22%; height: 38%;
    background: linear-gradient(100deg, transparent 5%, #1c5bff33 30%, #4cc3ff40 50%, #1c5bff33 70%, transparent 95%);
    filter: blur(60px); transform: rotate(-8deg);
    animation: sway 18s ease-in-out infinite alternate;
  }
  @keyframes sway { to { transform: rotate(-3deg) translateY(6vh); opacity: .6; } }

  /* bubbles */
  .bubble {
    position: absolute; bottom: -12vmin; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 28%, rgba(200,225,255,.55) 0, rgba(120,175,255,.18) 18%, rgba(40,90,220,.10) 55%, rgba(20,60,180,.04) 100%);
    border: 1px solid rgba(140, 190, 255, .28);
    box-shadow: inset 0 0 18px rgba(90,150,255,.18), 0 0 24px rgba(40,100,255,.12);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translate3d(0, 0, 0) scale(.9); opacity: 0; }
    10%  { opacity: 1; }
    50%  { transform: translate3d(var(--sway), -60vh, 0) scale(1); }
    100% { transform: translate3d(calc(var(--sway) * -1), -125vh, 0) scale(1.08); opacity: 0; }
  }

  /* ---------- Layout ---------- */
  main {
    position: relative; z-index: 1; min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; gap: 28px;
  }
  .logo {
    width: min(78vw, 440px); height: auto;
    filter: drop-shadow(0 6px 30px rgba(47,123,255,.35));
    animation: float 7s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-8px); } }

  form.go {
    width: min(92vw, 640px);
    display: flex; gap: 8px; padding: 8px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 999px;
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 10px 50px rgba(0, 20, 90, .5), inset 0 1px 0 rgba(255,255,255,.06);
    transition: border-color .2s, box-shadow .2s;
  }
  form.go:focus-within {
    border-color: rgba(110, 175, 255, .6);
    box-shadow: 0 10px 60px rgba(30, 90, 255, .35), 0 0 0 4px rgba(47,123,255,.15);
  }
  input[type=text], input[type=url], input[type=password] {
    flex: 1; min-width: 0;
    background: transparent; border: 0; outline: 0;
    color: var(--ink); font: inherit; font-size: 1.05rem;
    padding: 12px 18px;
  }
  input::placeholder { color: #6f86b8; }
  button.launch {
    border: 0; cursor: pointer; font: inherit; font-weight: 600;
    color: #fff; padding: 0 26px; border-radius: 999px;
    background: linear-gradient(135deg, var(--accent), #1a4fe0);
    box-shadow: 0 4px 20px rgba(47,123,255,.45);
    transition: transform .15s, filter .15s;
  }
  button.launch:hover { filter: brightness(1.12); transform: translateY(-1px); }
  button.launch:disabled { opacity: .6; cursor: wait; }

  .status { min-height: 1.3em; margin: -12px 0 0; font-size: .92rem; color: var(--muted); text-align: center; }
  .status.err { color: #ff9aa8; }

  details.settings {
    width: min(92vw, 640px);
    color: var(--muted); font-size: .9rem;
  }
  details.settings summary {
    cursor: pointer; text-align: center; list-style: none; user-select: none;
  }
  details.settings summary::-webkit-details-marker { display: none; }
  details.settings summary:hover { color: var(--ink); }
  .panel {
    margin-top: 12px; padding: 14px; display: grid; gap: 10px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .panel label { display: grid; gap: 4px; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
  .panel input {
    background: rgba(4, 12, 40, .6); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: .95rem;
  }
  .panel input:focus { border-color: rgba(110,175,255,.6); }
  .panel small { text-transform: none; letter-spacing: 0; opacity: .8; }

  @media (prefers-reduced-motion: reduce) {
    .blob, .ribbon, .bubble, .logo { animation: none !important; }
    .bubble { display: none; }
  }
</style>
</head>

  <div class="blob b4"></div>
  <div class="blob b5"></div>

  <form class="go" id="goForm" autocomplete="off">
    <input type="text" id="target" placeholder="Search or enter a URL" aria-label="Search or enter a URL" autofocus>
    <button class="launch" id="goBtn" type="submit">Go</button>
  </form>
  <p class="status" id="status" role="status"></p>

  <details class="settings">
    <summary>Proxy settings</summary>
    <div class="panel">
      <label>Rammerhead server
        <input type="url" id="server" placeholder="Leave blank if Rammerhead runs on this same domain">
        <small>Example: https://rh.example.com</small>
      </label>
      <label>Password (if your instance requires one)
        <input type="password" id="pass" placeholder="Optional">
      </label>
    </div>
  </details>
</main>

<script>
(function () {
  /* Set this to your Rammerhead instance. Blank = same origin
     (e.g. you reverse-proxy Rammerhead to this site's domain). */
  var DEFAULT_SERVER = "";

  var SEARCH = "https://duckduckgo.com/?q=";
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  $("server").value = store.get("rh_server") || DEFAULT_SERVER;
  $("pass").value = store.get("rh_pass");

  function normalize(input) {
    var v = input.trim();
    if (!v) return "";
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) return v;
    if (!/\s/.test(v) && /^[^\s]+\.[^\s]{2,}$/.test(v)) return "https://" + v;
    return SEARCH + encodeURIComponent(v);
  }

  function setStatus(msg, err) {
    var s = $("status");
    s.textContent = msg || "";
    s.className = "status" + (err ? " err" : "");
  }

  $("goForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var dest = normalize($("target").value);
    if (!dest) { setStatus("Enter a URL or a search first.", true); return; }

    var base = $("server").value.trim().replace(/\/+$/, "");
    var pass = $("pass").value;
    store.set("rh_server", base);
    store.set("rh_pass", pass);

    var btn = $("goBtn");
    btn.disabled = true;
    setStatus("Creating session…");

    var q = pass ? "?password=" + encodeURIComponent(pass) : "";
    fetch(base + "/newsession" + q, { credentials: "omit" })
      .then(function (r) {
        if (!r.ok) throw new Error(r.status === 403 ? "Wrong or missing password." : "Server returned " + r.status);
        return r.text();
      })
      .then(function (id) {
        id = id.trim();
        if (!/^[a-z0-9]+$/i.test(id)) throw new Error("Unexpected reply from server.");
        window.location.href = base + "/" + id + "/" + dest;
      })
      .catch(function (err) {
        btn.disabled = false;
        setStatus((err && err.message ? err.message + " " : "") +
          "Check the server address in Proxy settings.", true);
      });
  });

  /* ---------- bubbles ---------- */
  var host = $("bubbles");
  var count = Math.min(26, Math.round(window.innerWidth / 55));
  for (var i = 0; i < count; i++) {
    var b = document.createElement("span");
    b.className = "bubble";
    var size = 14 + Math.random() * 90;
    b.style.width = b.style.height = size + "px";
    b.style.left = Math.random() * 100 + "%";
    b.style.setProperty("--sway", (Math.random() * 60 - 30) + "px");
    b.style.animationDuration = (16 + Math.random() * 26) + "s";
    b.style.animationDelay = (-Math.random() * 40) + "s";
    b.style.filter = "blur(" + (size > 80 ? 1.5 : Math.random() * .8) + "px)";
    host.appendChild(b);
  }
})();
</script>
